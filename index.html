<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動漫天地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans TC', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 動漫風格背景 - 漸層星空 + 櫻花 */
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 飄落櫻花粒子 (CSS 動畫) */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            background:
                radial-gradient(ellipse 8px 10px at 10% 20%, rgba(255, 182, 193, 0.6) 0%, transparent 100%),
                radial-gradient(ellipse 6px 8px at 25% 40%, rgba(255, 105, 180, 0.5) 0%, transparent 100%),
                radial-gradient(ellipse 10px 12px at 50% 15%, rgba(255, 182, 193, 0.4) 0%, transparent 100%),
                radial-gradient(ellipse 7px 9px at 70% 30%, rgba(255, 105, 180, 0.3) 0%, transparent 100%),
                radial-gradient(ellipse 9px 11px at 85% 50%, rgba(255, 182, 193, 0.5) 0%, transparent 100%),
                radial-gradient(ellipse 5px 7px at 15% 60%, rgba(255, 105, 180, 0.4) 0%, transparent 100%),
                radial-gradient(ellipse 8px 10px at 40% 80%, rgba(255, 182, 193, 0.3) 0%, transparent 100%),
                radial-gradient(ellipse 6px 8px at 65% 70%, rgba(255, 105, 180, 0.4) 0%, transparent 100%),
                radial-gradient(ellipse 10px 12px at 90% 85%, rgba(255, 182, 193, 0.3) 0%, transparent 100%),
                radial-gradient(ellipse 7px 9px at 30% 90%, rgba(255, 105, 180, 0.3) 0%, transparent 100%),
                /* 星星 */
                radial-gradient(2px 2px at 5% 10%, #fff 0%, transparent 100%),
                radial-gradient(2px 2px at 20% 5%, #fff 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 8%, #fff 0%, transparent 100%),
                radial-gradient(2px 2px at 55% 3%, #fff 0%, transparent 100%),
                radial-gradient(1px 1px at 75% 12%, #fff 0%, transparent 100%),
                radial-gradient(2px 2px at 90% 7%, #fff 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 25%, #fff 0%, transparent 100%),
                radial-gradient(2px 2px at 60% 18%, #fff 0%, transparent 100%);
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 0;
            animation: fall 8s ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(3%) rotate(5deg); opacity: 0.8; }
            100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 95%;
            padding: 40px 20px;
            text-align: center;
        }

        header {
            margin-bottom: 45px;
        }

        header h1 {
            font-size: 3.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 40%, #fbc2eb 70%, #a18cd1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.15em;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: inline-block;
            padding-bottom: 12px;
        }

        .sites-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-top: 10px;
        }

        .site-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px 22px 22px;
            width: 155px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-decoration: none;
        }

        .site-card:hover {
            transform: translateY(-10px) scale(1.03);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 182, 193, 0.5);
            box-shadow: 0 20px 60px rgba(161, 140, 209, 0.3);
        }

        .site-card img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px;
            transition: transform 0.3s ease;
        }

        .site-card:hover img {
            transform: scale(1.1);
        }

        .site-card span {
            color: #f0e6ff;
            font-size: 0.95em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .site-card .desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75em;
            line-height: 1.3;
            min-height: 32px;
        }

        footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        /* 響應式 */
        @media (max-width: 600px) {
            header h1 { font-size: 2.2em; }
            .site-card { width: 130px; padding: 20px 16px 16px; }
            .site-card img { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✦ 動漫天地 ✦</h1>
            <p>探索最精彩的動漫世界</p>
        </header>

        <div class="sites-grid">
            <a class="site-card" href="https://myanimelist.net" target="_blank" rel="noopener">
                <img src="https://www.google.com/s2/favicons?domain=myanimelist.net&sz=64" alt="MyAnimeList">
                <span>MyAnimeList</span>
                <div class="desc">最大動漫資料庫</div>
            </a>

            <a class="site-card" href="https://www.crunchyroll.com" target="_blank" rel="noopener">
                <img src="https://www.google.com/s2/favicons?domain=crunchyroll.com&sz=64" alt="Crunchyroll">
                <span>Crunchyroll</span>
                <div class="desc">正版動漫串流</div>
            </a>

            <a class="site-card" href="https://anilist.co" target="_blank" rel="noopener">
                <img src="https://www.google.com/s2/favicons?domain=anilist.co&sz=64" alt="AniList">
                <span>AniList</span>
                <div class="desc">動漫追番清單</div>
            </a>

            <a class="site-card" href="https://www.anime-planet.com" target="_blank" rel="noopener">
                <img src="https://www.google.com/s2/favicons?domain=anime-planet.com&sz=64" alt="Anime-Planet">
                <span>Anime-Planet</span>
                <div class="desc">動漫推薦社群</div>
            </a>

            <a class="site-card" href="https://www.bilibili.com" target="_blank" rel="noopener">
                <img src="https://www.google.com/s2/favicons?domain=bilibili.com&sz=64" alt="Bilibili">
                <span>Bilibili</span>
                <div class="desc">彈幕動漫社區</div>
            </a>
        </div>

        <footer>「只要記住微笑，就一定能度過難關」— 夏目友人帳</footer>
    </div>
</body>
</html>
